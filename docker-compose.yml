version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_NIM_KEY=${NVIDIA_NIM_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - APP_USERS=${APP_USERS:-admin:admin123,kvothe:password123}
      - JWT_SECRET=${JWT_SECRET:-super-secret-production-jwt-key}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-gemini}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-2.5-flash}
      - DEFAULT_N_TURNS=${DEFAULT_N_TURNS:-5}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

